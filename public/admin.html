<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin Panel</title>
<style>

.m{background:#fff;border:1px solid #cdd9ea;border-radius:12px;padding:14px;margin-bottom:10px}.m.un{border-left:4px solid #0080fd}.m small{color:#51627d}

#login{position:fixed;inset:0;background:#03265a;display:none;place-items:center;z-index:50}#login form{background:#fff;padding:30px;border-radius:18px;width:min(380px,92vw);display:grid;gap:12px}#login h1{margin:0;font-size:22px;color:#03265a}#login input{padding:12px;border:1px solid #cdd9ea;border-radius:10px;font-size:15px}#le{color:#c0392b;font-size:14px}
@media(max-width:600px){#main{margin-bottom:200px}.top{padding:10px 12px}.rh{flex-wrap:wrap;gap:6px}.up{flex-wrap:wrap}.up input[type=text]{flex:1 1 140px}input[type=text],input[type=number],textarea,select,input:not([type]){font-size:16px}#login form{padding:22px}.bar{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}}
</style></head><body>
<div id="login"><form id="lf"><h1>Admin login</h1><input id="lu" placeholder="Username" autocomplete="username" required><input id="lp" type="password" placeholder="Password" autocomplete="current-password" required><button class="b" style="padding:13px">Sign in</button><div id="le"></div></form></div>
<div class="top"><b>⚙ Website Admin</b><div><a href="/" target="_blank">View site ↗</a><a href="#" id="lo">Logout</a></div></div>
<div class="tabs" id="tabs"></div><div id="main"></div>
<div class="bar" id="bar"><span id="dirty" class="status saved">All changes saved</span><button class="b secondary" id="backup" type="button">Download backup</button><button class="b secondary" id="restore" type="button">Restore JSON</button><input id="restoreFile" type="file" accept="application/json,.json" hidden><button class="b secondary" id="history" type="button">Version history</button><button class="b" id="save" type="button">Save all changes</button><span id="toast" role="status" aria-live="polite"></span></div>
<script>
function start(DATA){
var TPL=DATA._templates||{};
function collectPhotos(D){var s={};((D.workOrders&&D.workOrders.types)||[]).forEach(function(t){((t&&t.photos)||[]).forEach(function(p){if(p&&p.image)s[p.image]=1})});return s}
var SAVED=collectPhotos(DATA);
function dropUnsaved(urls){urls.forEach(function(u){if(u&&!SAVED[u])fetch('/api/admin/upload',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})}).catch(function(){})})}
function shrink(file){return new Promise(function(res){if(file.type==='image/gif'||file.size<=1500000){res(file);return}var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var m=1920,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){res(b&&b.size<file.size?b:file)},'image/jpeg',0.85)};img.onerror=function(){URL.revokeObjectURL(u);res(file)};img.src=u})}
function photoField(obj,key,w,cb){
 var v=obj[key],box=el('div');w.appendChild(box);function refresh(){if(cb)cb();else draw()}
 function draw(){box.innerHTML='';var g=el('div',{className:'phgrid'});
  v.forEach(function(it,i){var c=el('div',{className:'phc'}),cap=el('input',{type:'text',value:it.caption||'',placeholder:'Caption (optional)'}),bt=el('div',{className:'phb'});
   cap.oninput=function(){it.caption=cap.value};
   var l=el('button',{className:'s',textContent:'◀',type:'button'}),r=el('button',{className:'s',textContent:'▶',type:'button'}),x=el('button',{className:'s x',textContent:'Delete',type:'button'});
   l.onclick=function(){if(i>0){var t=v[i];v[i]=v[i-1];v[i-1]=t;setDirty();draw()}};
   r.onclick=function(){if(i<v.length-1){var t=v[i];v[i]=v[i+1];v[i+1]=t;setDirty();draw()}};
   x.onclick=function(){if(confirm('Delete this photo? It is permanently removed from the website and storage when you click Save all changes.')){v.splice(i,1);dropUnsaved([it.image]);setDirty();refresh()}};
   bt.appendChild(l);bt.appendChild(x);bt.appendChild(r);c.appendChild(el('img',{src:it.image,loading:'lazy'}));c.appendChild(cap);c.appendChild(bt);g.appendChild(c)});
  box.appendChild(g);
  if(!v.length)box.appendChild(el('p',{className:'help',textContent:'No photos yet.'}));
  var fi=el('input',{type:'file',accept:'image/*',multiple:true});
  fi.onchange=function(){var files=Array.prototype.slice.call(fi.files||[]),n=0,bad=0,why='';if(!files.length)return;
   (function next(){var f=files.shift();if(!f){toast(bad?(n+' uploaded, '+bad+' failed: '+(why||'unknown error')+'. Click Save all changes.'):(n+' photo(s) uploaded. Click Save all changes.'),!!bad);refresh();return}
    toast('Uploading '+(n+bad+1)+' of '+(n+bad+files.length+1)+'...');
    shrink(f).then(function(b){var fd=new FormData();fd.append('file',b,f.name);return fetch('/api/admin/upload',{method:'POST',body:fd})}).then(function(r){return r.json()}).then(function(j){if(j.ok){v.push({image:j.path,caption:''});n++;setDirty()}else{bad++;why=why||j.error||''}}).catch(function(){bad++;why=why||'Network error'}).then(next)})()};
  box.appendChild(el('div',{className:'f'},[el('label',{textContent:'Add photos (you can select many at once)'}),fi]))}
 draw();return w}
var dirty=false;
var main=document.getElementById('main');
function setDirty(){dirty=true;var d=document.getElementById('dirty');d.textContent='Unsaved changes';d.className='status dirty'}
function setSaved(){dirty=false;var d=document.getElementById('dirty');d.textContent='All changes saved';d.className='status saved'}
main.addEventListener('input',setDirty);main.addEventListener('change',setDirty);
window.onbeforeunload=function(e){if(dirty){e.preventDefault();e.returnValue='You have unsaved changes.'}};
var ICONS=/^(logoicon|logofull|favicon|image|photo|logo)/i;
function nice(k){var t=String(k).replace(/([A-Z])/g,' $1').replace(/_/g,' ');return t.charAt(0).toUpperCase()+t.slice(1)}
function el(t,p,c){var e=document.createElement(t);if(p)for(var k in p)e[k]=p[k];(c||[]).forEach(function(x){e.appendChild(x)});return e}
function blank(v){if(Array.isArray(v))return[];if(v&&typeof v==='object'){var o={};for(var k in v)o[k]=blank(v[k]);return o}if(typeof v==='boolean')return false;return typeof v==='number'?0:''}
function field(obj,key,label){
 var v=obj[key],w=el('div',{className:'f'});if(label!==false)w.appendChild(el('label',{textContent:nice(key)}));
 if(typeof v==='boolean'){var c=el('input',{type:'checkbox',checked:v});c.onchange=function(){obj[key]=c.checked};var l=w.querySelector('label');if(l){l.style.display='inline';l.style.marginRight='8px'};w.insertBefore(c,w.firstChild);if(l)w.appendChild(l);return w}
 if(Array.isArray(v)){
  if(key==='photos')return photoField(obj,key,w);
  var isStr=v.length?typeof v[0]==='string':(TPL[key]===''||typeof TPL[key]==='string');
  if(isStr){var ta=el('textarea',{value:v.join('\n')});ta.oninput=function(){obj[key]=ta.value.split('\n').map(function(s){return s.trim()}).filter(Boolean)};w.appendChild(ta);w.appendChild(el('div',{className:'help',textContent:'One item per line'}));return w}
  var box=el('div');w.appendChild(box);
  (function draw(){box.innerHTML='';v.forEach(function(it,i){
   var rp=el('div',{className:'rp'}),h=el('div',{className:'rh'},[el('span',{textContent:'#'+(i+1)})]),bt=el('span');
   [['↑',-1],['↓',1]].forEach(function(d){var b=el('button',{className:'s',textContent:d[0],type:'button'});b.onclick=function(){var j=i+d[1];if(j<0||j>=v.length)return;var t=v[i];v[i]=v[j];v[j]=t;draw()};bt.appendChild(b)});
   var rm=el('button',{className:'s x',textContent:'Remove',type:'button'});rm.onclick=function(){var ph=(it&&Array.isArray(it.photos))?it.photos:[];if(confirm(ph.length?'Remove this item and its '+ph.length+' photo(s)? The photos are permanently deleted when you click Save all changes.':'Remove this item?')){dropUnsaved(ph.map(function(p){return p&&p.image}));v.splice(i,1);draw()}};bt.appendChild(rm);h.appendChild(bt);rp.appendChild(h);
   if(it&&typeof it==='object')Object.keys(it).forEach(function(k){rp.appendChild(field(it,k))});box.appendChild(rp)});
   var add=el('button',{className:'b',textContent:'+ Add item',type:'button'});add.onclick=function(){var t=v.length?blank(v[0]):(TPL[key]!==undefined?JSON.parse(JSON.stringify(TPL[key])):'');v.push(t);draw()};box.appendChild(add)})();
  return w}
 if(v&&typeof v==='object'){var fs=el('fieldset',null,[el('legend',{textContent:nice(key)})]);Object.keys(v).forEach(function(k){fs.appendChild(field(v,k))});return fs}
 if(typeof v==='number'){var n=el('input',{type:'number',value:v});n.oninput=function(){obj[key]=Number(n.value)};w.appendChild(n);return w}
 if(/color|^(primary|dark|background|text)$/i.test(key)&&/^#[0-9a-f]{6}$/i.test(v)){var cp=el('input',{type:'color',value:v}),tx=el('input',{type:'text',value:v,style:'width:120px;margin-left:8px'});cp.oninput=function(){obj[key]=cp.value;tx.value=cp.value};tx.oninput=function(){obj[key]=tx.value;if(/^#[0-9a-f]{6}$/i.test(tx.value))cp.value=tx.value};w.appendChild(el('div',{className:'up'},[cp,tx]));return w}
 if(ICONS.test(key)){var ip=el('input',{type:'text',value:v}),img=el('img',{src:v}),fi=el('input',{type:'file',accept:'image/*'});img.onerror=function(){img.style.display='none'};ip.oninput=function(){obj[key]=ip.value;img.src=ip.value;img.style.display=''};
  fi.onchange=function(){var fd=new FormData();fd.append('file',fi.files[0]);toast('Uploading...');fetch('/api/admin/upload',{method:'POST',body:fd}).then(function(r){return r.json()}).then(function(j){if(j.ok){obj[key]=j.path;ip.value=j.path;img.src=j.path;img.style.display='';toast('Uploaded. Click Save all changes.')}else toast(j.error,1)})};
  w.appendChild(el('div',{className:'up'},[img,ip]));w.appendChild(fi);return w}
 var long=(typeof v==='string'&&(v.length>70||/desc|subtitle|text|message|answer|^a$|footer/i.test(key)));
 var inp=long?el('textarea',{value:v}):el('input',{type:'text',value:v});inp.oninput=function(){obj[key]=inp.value};w.appendChild(inp);return w}
var selType=0;
function typesManager(M,v){
 var box=el('fieldset');M.appendChild(box);
 function draw(){box.innerHTML='';box.appendChild(el('legend',{textContent:'Work types & photos'}));
  if(selType>=v.length)selType=Math.max(0,v.length-1);
  var chips=el('div',{style:'display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px'});
  v.forEach(function(t,i){var b=el('button',{type:'button',className:'tab'+(i===selType?' on':''),textContent:(t.name||'Untitled')+' ('+((t.photos||[]).length)+')'});b.onclick=function(){selType=i;draw()};chips.appendChild(b)});
  var add=el('button',{type:'button',className:'b',textContent:'+ Add type'});add.onclick=function(){v.push({name:'New type',desc:'',photos:[]});selType=v.length-1;setDirty();draw()};chips.appendChild(add);
  box.appendChild(chips);
  var t=v[selType];if(!t){box.appendChild(el('p',{className:'help',textContent:'No work types yet. Click + Add type.'}));return}
  if(!Array.isArray(t.photos))t.photos=[];
  var rp=el('div',{className:'rp'}),h=el('div',{className:'rh'},[el('span',{textContent:'Selected type'})]),bt=el('span');
  [['◀',-1],['▶',1]].forEach(function(d){var b=el('button',{className:'s',textContent:d[0],type:'button',title:'Change order'});b.onclick=function(){var j=selType+d[1];if(j<0||j>=v.length)return;var x=v[selType];v[selType]=v[j];v[j]=x;selType=j;setDirty();draw()};bt.appendChild(b)});
  var rm=el('button',{className:'s x',textContent:'Remove type',type:'button'});
  rm.onclick=function(){var n=t.photos.length;if(confirm(n?'Remove this work type and its '+n+' photo(s)? The photos are permanently deleted when you click Save all changes.':'Remove this work type?')){dropUnsaved(t.photos.map(function(p){return p&&p.image}));v.splice(selType,1);setDirty();draw()}};
  bt.appendChild(rm);h.appendChild(bt);rp.appendChild(h);
  var nf=field(t,'name');nf.querySelector('input').addEventListener('change',draw);rp.appendChild(nf);
  rp.appendChild(field(t,'desc'));
  var pw=el('div',{className:'f'},[el('label',{textContent:'Photos of '+(t.name||'this type')})]);photoField(t,'photos',pw,draw);rp.appendChild(pw);
  box.appendChild(rp)}
 draw()}
function toast(m,err){var t=document.getElementById('toast');t.textContent=m;t.style.color=err?'#c0392b':'#15803d'}
function saveData(data,successMessage){return fetch('/api/admin/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json().then(function(j){if(!r.ok||!j.ok)throw new Error(j.error||'Save failed');return j})}).then(function(j){SAVED=collectPhotos(DATA);setSaved();toast(j&&j.warning?j.warning:(successMessage||'Saved ✓ Website updated')+(j&&j.deleted?' · '+j.deleted+' photo(s) deleted':''),!!(j&&j.warning))})}
var keys=Object.keys(DATA).filter(function(k){return k[0]!=='_'}),cur=keys[0];
function tabs(){var T=document.getElementById('tabs');T.innerHTML='';keys.concat(['messages','account']).forEach(function(k){var b=el('button',{className:'tab'+(k===cur?' on':''),textContent:k==='messages'?'📩 Messages':k==='account'?'🔒 Account':nice(k)});b.onclick=function(){cur=k;tabs();show()};T.appendChild(b)})}
function show(){var M=document.getElementById('main');M.innerHTML='';document.getElementById('bar').style.display=(cur==='messages'||cur==='account')?'none':'flex';
 if(cur==='messages')return inbox(M);if(cur==='account')return account(M);
 var v=DATA[cur];if(cur==='workOrders'&&v&&Array.isArray(v.types)){Object.keys(v).forEach(function(k){if(k!=='types')M.appendChild(field(v,k))});typesManager(M,v.types)}else if(Array.isArray(v)){var h={};h[cur]=v;M.appendChild(field(h,cur,false))}else Object.keys(v).forEach(function(k){M.appendChild(field(v,k))})
 if(cur==='workOrders'){var sb=el('div',{className:'help',textContent:'Checking storage...',style:'padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #cdd9ea;margin-bottom:12px'});M.insertBefore(sb,M.firstChild);
  fetch('/api/admin/status',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){var bad=[];if(!j.redis)bad.push('Upstash Redis is not connected (content cannot be saved)');if(!j.blob)bad.push('Vercel Blob is not connected: add BLOB_READ_WRITE_TOKEN (Vercel > Storage > Blob), then Redeploy (photo upload will not work)');
   if(bad.length){sb.textContent='⚠ '+bad.join(' | ');sb.style.color='#b91c1c';sb.style.borderColor='#fca5a5';sb.style.background='#fef2f2'}else{sb.textContent='✓ Storage connected: you can save and upload photos.';sb.style.color='#15803d'}}).catch(function(){sb.textContent='Could not check storage status.';sb.style.color='#b45309'})}
}
function inbox(M){M.textContent='Loading...';fetch('/api/admin/messages',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Messages could not be loaded.');return r.json()}).then(function(L){M.innerHTML='';if(!Array.isArray(L))throw new Error('Unexpected message response.');if(!L.length)M.textContent='No messages yet.';
 L.forEach(function(m){var d=el('div',{className:'m'+(m.read?'':' un')});d.appendChild(el('b',{textContent:m.name+' · '+m.service}));
  d.appendChild(el('div',{textContent:m.email}));d.appendChild(el('small',{textContent:new Date(m.ts*1000).toLocaleString()}));d.appendChild(el('p',{textContent:m.message,style:'white-space:pre-wrap'}));
  function act(a){return fetch('/api/admin/messages',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:m.id,action:a === 'delete' ? 'delete' : 'toggle-read'})}).then(function(r){if(!r.ok)throw new Error('Could not update message.');return inbox(M)}).catch(function(e){M.prepend(el('p',{textContent:e.message,style:'color:#c0392b'}))})}
  var r=el('button',{className:'s',textContent:m.read?'Mark unread':'Mark read'});r.onclick=function(){act('read')};
  var x=el('button',{className:'s x',textContent:'Delete'});x.onclick=function(){if(confirm('Delete message?'))act('delete')};
  var rp=el('a',{className:'s',textContent:'Reply by email',href:'mailto:'+encodeURIComponent(m.email),style:'text-decoration:none'});d.appendChild(r);d.appendChild(x);d.appendChild(rp);M.appendChild(d)})}).catch(function(e){M.textContent=e.message||'Could not load messages.'})}
function account(M){M.appendChild(el('fieldset',null,[el('legend',{textContent:'Account & security'}),el('p',{textContent:'Set ADMIN_USER and ADMIN_PASSWORD in Vercel → Project → Settings → Environment Variables. Also set SESSION_SECRET to a random value with at least 32 characters. Redeploy after changing credentials.'}),el('p',{textContent:'Admin sessions expire after 8 hours. Keep credentials private and use a unique password.'})]))}
document.getElementById('save').onclick=function(){var b=this;b.disabled=true;toast('Saving...');saveData(DATA).catch(function(e){toast(e.message,1)}).finally(function(){b.disabled=false})};
document.getElementById('backup').onclick=function(){var blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a',{href:url,download:'taskvion-content-backup-'+new Date().toISOString().slice(0,10)+'.json'});a.click();URL.revokeObjectURL(url);toast('Backup downloaded')};
document.getElementById('restore').onclick=function(){document.getElementById('restoreFile').click()};
document.getElementById('restoreFile').onchange=function(){var file=this.files&&this.files[0];if(!file)return;if(file.size>1000000){toast('Backup file is too large.',1);this.value='';return}var reader=new FileReader();reader.onload=function(){try{var data=JSON.parse(reader.result);if(!data||typeof data!=='object'||Array.isArray(data)||!confirm('Replace the current editor content with this backup? Save it to the website after review.'))return;Object.keys(DATA).forEach(function(k){delete DATA[k]});Object.keys(data).forEach(function(k){DATA[k]=data[k]});keys=Object.keys(DATA).filter(function(k){return k[0]!=='_'});cur=keys[0];setDirty();tabs();show();toast('Backup loaded. Review and click Save all changes.')}catch(e){toast('Invalid JSON backup.',1)}};reader.readAsText(file);this.value=''};
document.getElementById('history').onclick=function(){var b=this;b.disabled=true;fetch('/api/admin/content?history=1',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Could not load version history.');return r.json()}).then(function(items){if(!items.length){toast('No previous versions saved yet.');return}var choice=prompt('Enter a version number to restore (1 = newest):\n'+items.map(function(x,i){return (i+1)+'. '+new Date(x.savedAt).toLocaleString()}).join('\n'));if(choice===null)return;var index=Number(choice)-1;if(!Number.isInteger(index)||index<0||index>=items.length){toast('Invalid version number.',1);return}if(!confirm('Load this saved version into the editor? You can review before saving.'))return;Object.keys(DATA).forEach(function(k){delete DATA[k]});Object.keys(items[index].content).forEach(function(k){DATA[k]=items[index].content[k]});keys=Object.keys(DATA).filter(function(k){return k[0]!=='_'});cur=keys[0];setDirty();tabs();show();toast('Version loaded. Review and save to publish.')}).catch(function(e){toast(e.message,1)}).finally(function(){b.disabled=false})};
tabs();show();
}
function boot(){fetch('/api/admin/content',{cache:'no-store'}).then(function(r){if(r.status===401){document.getElementById('login').style.display='grid';return null}if(!r.ok)throw new Error('Stored content could not be loaded. Nothing was opened for editing. Please reload and try again.');return r.json()}).then(function(d){if(d){if(!d||typeof d!=='object'||d.ok===false||!d.settings||!d.hero)throw new Error('Unexpected content response. Nothing was opened for editing.');document.getElementById('login').style.display='none';start(d)}}).catch(function(e){document.getElementById('login').style.display='grid';document.getElementById('le').textContent=e.message||'Could not load admin.'})}
document.getElementById('lf').onsubmit=function(e){e.preventDefault();var submit=e.currentTarget.querySelector('button');submit.disabled=true;document.getElementById('le').textContent='Signing in...';fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:document.getElementById('lu').value,password:document.getElementById('lp').value})}).then(function(r){return r.json()}).then(function(j){if(j.ok)boot();else document.getElementById('le').textContent=j.error}).catch(function(){document.getElementById('le').textContent='Login failed. Please try again.'}).finally(function(){submit.disabled=false})};
document.getElementById('lo').onclick=function(e){e.preventDefault();fetch('/api/admin/logout',{method:'POST'}).then(function(){location.reload()})};
boot();
</script></body></html>
